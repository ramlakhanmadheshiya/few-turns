// Godot Android plugin (v2) that saves the share picture to the gallery and shares it.
// Built by CI: gradle -p plugins_src/fewturns_share assembleRelease
plugins {
    id 'com.android.library' version '8.11.1'
}

android {
    namespace 'com.theramlakhan.fewturns.share'
    compileSdk 36

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'org.godotengine:godot:4.7.2.stable'
    compileOnly 'androidx.core:core:1.13.1'
    compileOnly 'androidx.annotation:annotation:1.8.0'
}
